[mgr]
prepend_keymap = [
  # Linemode
  { on = [ "m", "s" ],   run = "linemode size",        desc = "Set linemode to size" },
  { on = [ "m", "p" ],   run = "linemode permissions", desc = "Set linemode to permissions" },
  { on = [ "m", "m" ],   run = "linemode mtime",       desc = "Set linemode to mtime" },
  { on = [ "m", "n" ],   run = "linemode none",        desc = "Set linemode to none" },
  # { on = [ "m", "c" ], run = "linemode custom",      desc = "Set linemode to custom" },
  { on = [ "m", "f" ],   run = "linemode file_info",   desc = "Set linemode to file_info" },

#  {on   = [ "f" ],       run = "plugin jump-to-char", desc = "Jump to char" },

  { on   = [ "l" ],      run  = "plugin --sync smart-enter", desc = "Enter the child directory, or open the file" },

  { on = ["c", "k", "e"], run = "shell --block -- chmod +x %s", desc = "Make selected file(s) executable" },
  { on = ["c", "k", "u"], run = "shell --block -- chmod -x %s", desc = "Make selected file(s) non-executable" },
  { on   = [ "c", "m" ], run  = "plugin chmod", desc = "Chmod on selected files"},
  # ============ PANE CONTROL (toggle-pane plugin) ============
  { on = ["g", "p"], run = "plugin toggle-pane min-parent", desc = "Show or hide the parent pane" },
  { on = ["g", "P"], run = "plugin toggle-pane max-parent", desc = "Maximize or restore the parent pane" },
  { on = ["g", "c"], run = "plugin toggle-pane min-current", desc = "Show or hide the current pane" },
  { on = ["g", "C"], run = "plugin toggle-pane max-current", desc = "Maximize or restore the current pane" },
  { on = ["g", "v"], run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  { on = ["g", "V"], run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
  { on = ["g", "r"], run = "plugin toggle-pane reset", desc = "Reset all panes to configured ratio" },

  # ============ SELECTION OPERATIONS ============
  { on = "<Space>", run = ["toggle", "arrow 1"], desc = "Toggle selection and move down" },
  { on = "u", run = ["unyank", "escape --select"], desc = "Unyank and clear all selections" },

  { on = "d",            run = "yank --cut",                  desc = "Yank selected files (cut)" },
  { on = "-",            run = "link",                        desc = "Symlink the absolute path of yanked files" },
  { on = "_",            run = "link --relative",             desc = "Symlink the relative path of yanked files" },

#  { on   = [ "e","g" ],  run  = "plugin fg",         desc = "find file by content (fuzzy match)" },
#  { on   = [ "e","G" ],  run  = "plugin fg -- rg",   desc = "find file by content (ripgrep match)" },
#  { on   = [ "e","f" ],  run  = "plugin fg -- fzf",  desc = "find file by filename" },

  { on   = ["t", "t" ],          run  = "plugin smart-tab",  desc = "Create a tab and enter the hovered directory"},

  { on = [ "g", "n" ],   run = "cd /mnt/nasgard",    desc = "Go NAS" },
  { on = [ "g", "c" ],   run = "cd /home/eddie/coding",    desc = "Go coding" },
  { on = [ "g", "d" ],   run = "cd /opt/docker",    desc = "Go Docker" },

  { on = "Q",            run = "quit",               desc = "Quit the process" },
  { on = "q",            run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },

  { on = ["M","s"],      run = "plugin sshfs -- menu",        desc = "Open SSHFS options" },
  { on = "o",            run = "open",                        desc = "Open selected files" },
  { on = "O",            run = "open --interactive",          desc = "Open selected files interactively" },

  { on = ["F", "r"],     run = "plugin fr rg", desc = "Search file by content (rg)" },
  { on = ["F", "R"],     run = "plugin fr rg fzf", desc = "Search file by content (fzf)" },
  { on = ["F", "a"],     run = "plugin fr rga", desc = "Search file by content (rga)" },

  { on = "f",     run = "plugin fchar start", desc = "Jump to first char in filename" },

  ]

